# nginx.conf
#
# nginx is a web server that can also act as a reverse proxy and load balancer.
# Here we only use the load balancing feature.
#
# The flow:
#   External request → port 8000 (nginx) → one of ports 8010/8011/8012/8013 (OrderService)
#
# nginx picks which OrderService instance using round-robin by default:
# request 1 → 8010, request 2 → 8011, request 3 → 8012, request 4 → 8013,
# request 5 → 8010, and so on.

events {
    # How many simultaneous connections nginx can handle per worker process.
    # 1024 is a safe default for our scale.
    worker_connections 1024;
}

http {

    # ── Upstream block ────────────────────────────────────────────────────────
    #
    # "upstream" defines a named group of backend servers.
    # nginx will distribute requests across all of them.
    #
    # host.docker.internal is a special DNS name that Docker provides on
    # Windows and Mac — it resolves to your laptop's IP as seen from inside
    # the Docker container. This lets nginx (running in Docker) reach
    # OrderService (running on your laptop directly).

    upstream order_service {
        server host.docker.internal:8010;
        server host.docker.internal:8011;
        server host.docker.internal:8012;
        server host.docker.internal:8013;

        # keepalive: keep 32 connections to backends alive between requests.
        # Without this, nginx opens a new TCP connection for every request —
        # expensive at high load.
        keepalive 32;
    }

    server {
        # nginx listens on port 80 inside its container.
        # docker-compose maps that to port 8000 on your laptop.
        listen 80;

        location / {
            proxy_pass http://order_service;

            # These headers tell the backend who the original client was.
            # Useful for logging and debugging.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Use HTTP/1.1 so keepalive connections work.
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # How long to wait for a backend to respond before giving up.
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }
    }
}